name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # test/sync.test.js is skipped here: the zerotool-dev checkout is not available in CI.
      - run: npm test
      - run: npm run typecheck
      - run: node scripts/rules-table.mjs --check
