# Publish to npm when a v* tag is pushed. Uses npm trusted publishing (OIDC), no token.
#
# This workflow fails until the package exists on npm and this workflow is set as its
# trusted publisher: npmjs.com → secret-redactor → Settings → Trusted publishing →
# GitHub Actions, user "kassol", repository "secret-redactor", workflow filename
# "publish.yml", and "Allow npm publish" selected. See AGENTS.md.
#
# Requirements (docs.npmjs.com/trusted-publishers, read 2026-10-01): npm CLI 11.5.1 or
# later and Node 22.14.0 or later, a GitHub-hosted runner, `id-token: write`, and
# package.json repository.url equal to this repository.

name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check that the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm --version
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: node scripts/rules-table.mjs --check
      - run: npm publish --provenance --access public
